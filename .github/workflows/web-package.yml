# Fork-only: build the static web zip (OCR models included) and upload it as an artifact.
name: Web package

on:
  workflow_dispatch:
  push:
    branches: [deploy/web-auto-ocr-no-banner]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install trunk
        run: cargo install trunk --locked

      - name: Package web zip
        run: bash packaging/web/package.sh

      - name: Upload pdfcraft-web zip
        uses: actions/upload-artifact@v4
        with:
          name: pdfcraft-web
          path: dist/pdfcraft-web-*.zip
          if-no-files-found: error
