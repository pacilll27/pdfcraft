# Fork-only: build the static web zip (OCR models included) and upload it as an artifact / release.
name: Web package

on:
  workflow_dispatch:
  push:
    branches: [main, deploy/web-auto-ocr-no-banner]

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Prebuilt binary — `cargo install trunk` can take 20+ minutes compiling.
      - name: Install trunk
        run: |
          set -euo pipefail
          VER=0.22.1
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${VER}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin trunk
          trunk --version

      - name: Package web zip
        run: bash packaging/web/package.sh

      - name: Upload pdfcraft-web zip
        uses: actions/upload-artifact@v4
        with:
          name: pdfcraft-web
          path: dist/release/pdfcraft-web-*.zip
          if-no-files-found: error

      - name: Publish release web-deploy-2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ZIP=$(ls dist/release/pdfcraft-web-*.zip | head -n1)
          TAG=web-deploy-3
          if gh release view "$TAG" >/dev/null 2>&1; then TAG=web-deploy-3b; fi
          gh release create "$TAG" "$ZIP" \
            --title "Web deploy (${TAG})" \
            --notes "Static web build from \`${GITHUB_SHA:0:9}\` (hide Planned/AI tools; Discord title-bar removed; auto-OCR; no community banner)."
